<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Happy Diwali</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c26b;--gold2:#ffe3a3;--ice:#cfe8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
@property --a{syntax:'<color>';inherits:true;initial-value:#040a24}@property --b{syntax:'<color>';inherits:true;initial-value:#0c1a4a}@property --c{syntax:'<color>';inherits:true;initial-value:#6a2a55}@property --g1{syntax:'<color>';inherits:true;initial-value:#2fe3c4}@property --g2{syntax:'<color>';inherits:true;initial-value:#8a5cff}body{--a:#040a24;--b:#0c1a4a;--c:#6a2a55;--g1:#2fe3c4;--g2:#8a5cff;transition:--a 2.2s,--b 2.2s,--c 2.2s,--g1 2.2s,--g2 2.2s;background:linear-gradient(var(--a) 0%,var(--b) 45%,var(--c) 100%);color:#fff4e0;font-family:'Jost',system-ui,sans-serif;font-weight:300;overflow:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.au{position:fixed;width:130vw;height:60vh;left:-15vw;top:-10vh;filter:blur(60px);opacity:.5;background:radial-gradient(ellipse at 30% 50%,var(--g1),transparent 60%),radial-gradient(ellipse at 70% 40%,var(--g2),transparent 60%);animation:au 14s ease-in-out infinite alternate}
.au.b{top:6vh;opacity:.28;background:radial-gradient(ellipse at 60% 50%,#ffb347,transparent 55%);animation-duration:19s}
@keyframes au{to{transform:translate(8vw,6vh) scale(1.15)}}
.lan{position:fixed;bottom:-12vh;z-index:1;border-radius:42% 42% 30% 30%;background:radial-gradient(circle at 50% 60%,#ffe9a8,#ff9a3c 70%);box-shadow:0 0 24px 6px rgba(255,160,60,.45);opacity:.7;animation:rise linear infinite}
@keyframes rise{to{transform:translate(var(--dx),-125vh)}}
.hills{position:fixed;left:0;bottom:0;width:100%;height:17vh;z-index:1;pointer-events:none}
.hd{position:fixed;bottom:3.5vh;width:38px;height:32px;z-index:1;filter:drop-shadow(0 0 12px rgba(255,170,60,.8))}
.screen{position:relative;z-index:2;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px}
.screen.on{display:flex;animation:fade 1.2s ease both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(42px,12vw,74px);margin:8px 0;background:linear-gradient(90deg,#ffd27a,#fff,#cfe8ff,#fff,#ffd27a);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.sub{letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.hint{max-width:290px;line-height:1.7;font-size:14.5px;margin:14px 0 22px;color:var(--ice);opacity:.9}
.diya{width:96px;height:80px;filter:drop-shadow(0 0 24px rgba(255,170,60,.75))}
.flame{transform-origin:48px 40px;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1deg)}30%{transform:scale(.93,1.08) rotate(2deg)}60%{transform:scale(1.05,.95) rotate(-2deg)}}
.pin{display:flex;gap:9px}
.pin input{width:46px;height:58px;border-radius:15px;border:1px solid rgba(207,232,255,.4);background:rgba(255,255,255,.07);backdrop-filter:blur(8px);color:var(--gold2);font:500 26px 'Cormorant Garamond',serif;text-align:center;outline:none;transition:.3s;padding:0}
.pin.p4 input{width:54px;height:64px;margin:0 3px}
.pin input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,194,107,.14),0 0 22px rgba(245,170,70,.35)}
.pin.bad{animation:shake .5s}.pin.bad input{border-color:#ff8a8a}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#greet{perspective:900px}#read{display:none;flex-direction:column;align-items:center;perspective:900px;perspective-origin:50% 45%}
#read{width:100%}#txt{position:relative;width:100%;max-width:340px;height:230px;perspective:650px;perspective-origin:50% 50%}.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 6px;font:500 clamp(25px,7vw,32px)/1.5 'Cormorant Garamond',Georgia,serif;color:#fff;text-shadow:0 0 20px rgba(255,200,120,.5);will-change:transform,opacity;backface-visibility:hidden}.layer.app{animation:app 1.5s .45s cubic-bezier(.15,.7,.2,1) both}.rec{animation:rec 1.1s cubic-bezier(.5,0,.9,.4) forwards!important}@keyframes rec{0%{transform:translateZ(0);opacity:1}70%{opacity:.6}100%{transform:translateZ(-1300px) rotateY(-14deg);opacity:0}}@keyframes app{0%{transform:translateZ(-1200px) rotateY(14deg);opacity:0;letter-spacing:.2em}40%{opacity:.7}100%{transform:none;opacity:1;letter-spacing:0}}
#intro.rec{backface-visibility:hidden}
#intro{transition:opacity .35s,filter .35s;display:flex;flex-direction:column;align-items:center}
.w{display:inline-block;opacity:0;transform:translateZ(-500px) translateY(16px);filter:blur(8px);animation:wIn 1.3s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(.3s + var(--i)*.09s);margin:0 .13em}
@keyframes wIn{to{opacity:1;transform:none;filter:none}}
#dots{display:flex;gap:9px;margin:18px 0 8px}#dots i{width:7px;height:7px;border-radius:50%;background:rgba(207,232,255,.3);transition:.4s}#dots i.a{background:var(--gold);box-shadow:0 0 10px var(--gold);transform:scale(1.3)}
.tap{margin-top:22px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--ice);animation:bl 2.4s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:.9}}
.btn{border:0;cursor:pointer;padding:15px 30px;border-radius:40px;font:400 14px 'Jost',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#2a0b1a;background:linear-gradient(135deg,#ffe3a3,#f5a84b);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,168,75,.55)}50%{box-shadow:0 0 0 16px rgba(245,168,75,0)}}
#open{display:none;margin-top:14px}#open.show{display:block;animation:fade 1s ease both,pulse 2.6s 1s infinite}
.win{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(6,10,30,.9);perspective:1000px;backdrop-filter:blur(6px)}
.win.on{display:flex;animation:fade .6s ease both}
.frame{position:relative;width:min(250px,66vw);height:min(330px,44vh);border:2px solid var(--gold);border-radius:125px 125px 14px 14px;overflow:hidden;box-shadow:0 0 60px rgba(245,170,70,.35);background:radial-gradient(circle at 50% 55%,#fff2c9,#f5a84b 40%,#6a1b33 100%)}
.inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:#3a0f1f}
.inner h2{font:600 28px 'Cormorant Garamond',serif;margin:0}
.inner .btn{background:#3a0f1f;color:var(--gold2);visibility:hidden}.win.open .inner .btn{visibility:visible;animation:fade 1s 1.6s both,pulse 2.6s 2.6s infinite}
.door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(135deg,#1c3f7a,#0d1f4a);transition:transform 1.8s cubic-bezier(.7,0,.2,1) .3s;border:1px solid rgba(245,194,107,.5)}
.door.l{left:0;transform-origin:left}.door.r{right:0;transform-origin:right}
.door:after{content:'✦';position:absolute;top:50%;color:var(--gold);font-size:20px}.l:after{right:12px}.r:after{left:12px}
.win.open .l{transform:rotateY(-105deg)}.win.open .r{transform:rotateY(105deg)}
.win.open #wp{display:none}
#wp{text-align:center}#wp p{margin:0 0 14px;font-size:13px;letter-spacing:.12em;color:var(--ice)}
.x,#mu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;z-index:9;width:40px;height:40px;border-radius:50%;border:1px solid rgba(245,194,107,.4);background:rgba(255,255,255,.08);color:var(--gold2);font-size:20px;cursor:pointer}
#mu{right:auto;left:16px;font-size:17px}.x{z-index:10}
#hl{position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;overflow:hidden}
#cam{position:fixed;inset:0;perspective:900px;overflow:hidden;z-index:0;pointer-events:none}#world{position:absolute;inset:0;transform-style:preserve-3d}
#world.sw0{animation:c0 2.6s cubic-bezier(.5,0,.2,1)}#world.sw1{animation:c1 2.6s cubic-bezier(.5,0,.2,1)}
@keyframes c0{45%{transform:rotateY(-24deg) rotateX(5deg) scale(1.2) translateZ(-120px)}}@keyframes c1{45%{transform:rotateY(24deg) rotateX(-5deg) scale(1.2) translateZ(-120px)}}
.hills{transform:translateZ(110px)}.hd{transform:translateZ(150px)}
.layer{transform-style:preserve-3d;will-change:transform;text-shadow:none}
.layer.app{animation:lapp 1.8s .55s cubic-bezier(.15,.8,.2,1) both}.layer.go{animation:lgo 1.3s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes lapp{0%{transform:translateZ(-1000px) rotateY(28deg)}100%{transform:none}}@keyframes lgo{to{transform:translateZ(-1000px) rotateY(-24deg)}}
.fl{display:block;text-align:center;transform-style:preserve-3d;font-weight:600;font-size:clamp(27px,7.6vw,36px);animation:fl 7s ease-in-out infinite alternate}
@keyframes fl{from{transform:rotateY(-9deg) rotateX(3deg)}to{transform:rotateY(9deg) rotateX(-3deg) translateZ(30px)}}
.v{display:inline-block;margin:0 .12em;color:#ffe9b8;transform-style:preserve-3d;text-shadow:0 1px 0 #d9962e,0 2px 0 #c68527,0 3px 0 #b27520,0 4px 0 #9e661a,0 5px 0 #8a5715,0 6px 0 #774910,0 11px 16px rgba(0,0,0,.55),0 0 30px rgba(255,200,120,.5);opacity:0;animation:vin 1.3s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.6s + var(--i)*.12s)}
@keyframes vin{0%{opacity:0;transform:translateZ(-800px) rotateX(-80deg) rotateY(30deg)}100%{opacity:1;transform:none}}
.go .v{animation:vout .9s cubic-bezier(.6,0,.9,.4) forwards;animation-delay:calc(var(--i)*.05s)}
@keyframes vout{to{opacity:0;transform:translateZ(-1200px) rotateX(55deg) rotateY(-25deg)}}
</style></head><body>
<div id="cam"><div id="world"><div class="au"></div><div class="au b"></div></div></div><canvas id="fx"></canvas>
<svg width="0" height="0" style="position:absolute"><defs><symbol id="d" viewBox="0 0 96 80"><g class="flame"><path d="M48 6c9 12 14 18 14 27a14 14 0 0 1-28 0c0-9 5-15 14-27z" fill="#ffb347"/><path d="M48 18c5 7 8 11 8 16a8 8 0 0 1-16 0c0-5 3-9 8-16z" fill="#fff3c4"/></g><path d="M6 46h84c0 18-16 30-42 30S6 64 6 46z" fill="#c2561d"/><path d="M6 46h84" stroke="#ffd27a" stroke-width="3"/><path d="M26 58h44" stroke="#ffd27a" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/></symbol></defs></svg>
<svg class="hills" viewBox="0 0 400 120" preserveAspectRatio="none"><path d="M0 70C60 40 120 60 190 45S330 60 400 40V120H0Z" fill="#1b2a63"/><path d="M0 95C70 70 140 90 210 72S340 85 400 70V120H0Z" fill="#e9f3ff"/></svg>
<svg class="hd" style="left:10%"><use href="#d"/></svg><svg class="hd" style="left:calc(50% - 19px)"><use href="#d"/></svg><svg class="hd" style="right:10%"><use href="#d"/></svg>
<label id="hl"><input type="checkbox" switch></label>
<button id="mu" aria-label="Music">♪</button>

<section id="lock" class="screen on">
<svg class="diya"><use href="#d"/></svg>
<div class="sub">A little note for you</div>
<h1>Happy Diwali</h1>
<p class="hint">Enter the 4-digit code to open.<br>Write the date first, then the month (DDMM).</p>
<div class="pin p4" id="pin1"></div>
</section>

<section id="greet" class="screen" style="cursor:pointer">
<div id="intro"><svg class="diya"><use href="#d"/></svg><div class="sub">🪔 Shubh Deepavali 🪔</div><h1>Happy Diwali</h1><div class="tap">tap to continue</div></div>
<div id="read"><div id="txt"></div><div id="dots"></div><div class="tap" id="th">tap to continue</div><button class="btn" id="open">✦ Special Window</button></div>
</section>

<div class="win" id="win"><button class="x" id="close" aria-label="Close">×</button>
<div id="wp"><p>SPECIAL WINDOW<br><span style="opacity:.7">Enter the 6-digit code</span></p><div class="pin" id="pin2"></div></div>
<div class="frame"><div class="inner"><div style="font-size:34px">🪔</div><h2>Just for you</h2><button class="btn" id="go">Step inside</button></div><div class="door l"></div><div class="door r"></div></div></div>
<audio id="au" loop preload="auto" src="https://res.cloudinary.com/da0yz9hl7/video/upload/v1781287833/Indila_-_Love_Story_Extended_Instrumental_slowed_reverb_k6uhoz.mp3"></audio>

<script>
const BLOB="LPPMepfC1sj8B6lAOK1biuZwj4dXB1NtjKVROMus1hTUQeMjnqTObwLvqHW+fDY+/iWPnd1ocUWs12s9mcb6YjrDwBFdf9lvDmCOMj/w0Q==",H="051f53ab9184de66c062475c073f1962ae5a5ff740d071981373458220fa4e21",$=s=>document.querySelector(s);let URLX=null;
function hap(p){try{if(navigator.vibrate)navigator.vibrate(p);else $('#hl').click()}catch(e){}}
async function sha(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function dec(code){try{const b=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0));const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},k,b.slice(28)))}catch(e){return null}}
function pin(box,n,full){box.innerHTML='<input type="password" inputmode="numeric" maxlength="1" autocomplete="off">'.repeat(n);const ins=[...box.children];
const bad=()=>{hap([40,60,40]);box.classList.add('bad');setTimeout(()=>{box.classList.remove('bad');ins.forEach(x=>x.value='');ins[0].focus()},650)};
ins.forEach((el,i)=>{el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'');if(el.value){hap(8);if(i<n-1)ins[i+1].focus()}if(ins.every(x=>x.value))full(ins.map(x=>x.value).join(''),bad)});
el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&i>0){ins[i-1].focus();ins[i-1].value=''}})});return ins}
pin($('#pin1'),4,async(c,bad)=>{if(await sha('diwali'+c)===H){hap([15,40,25,40,60]);$('#lock').classList.remove('on');$('#greet').classList.add('on');for(let i=0;i<6;i++)setTimeout(()=>burst(innerWidth*(.2+Math.random()*.6),innerHeight*(.12+Math.random()*.35)),i*450)}else bad()});
const w2=pin($('#pin2'),6,async(c,bad)=>{const u=await dec(c);if(u){URLX=u;hap([30,50,60]);$('#win').classList.add('open')}else bad()});
const L=["Wishing you a very happy and prosperous Diwali. 🪔✨","I understand that you may not wish to respond to this message, and I completely respect that.","Still, I wanted to take a moment to wish you.","There is no expectation from my side. I hope you won’t mind this small gesture.","Take care and have a wonderful Diwali."];
let n=-1,busy=false;$('#dots').innerHTML='<i></i>'.repeat(L.length);
$('#greet').addEventListener('click',e=>{if(e.target.closest('button')||busy||n>=L.length-1)return;busy=true;hap([12,30,18]);
const st=$('#txt'),old=st.querySelector('.layer');
function mk(){n++;const d=document.createElement('div');d.className='layer app';d.innerHTML='<div class="fl">'+L[n].split(' ').map((w,i)=>`<span class="v" style="--i:${i}">${w}</span>`).join(' ')+'</div>';st.appendChild(d);scene(n+1);
[...$('#dots').children].forEach((x,i)=>x.classList.toggle('a',i===n));
setTimeout(()=>old&&old.remove(),1300);setTimeout(()=>hap(22),1750);setTimeout(()=>{busy=false},1900);
if(n===L.length-1){$('#th').style.display='none';setTimeout(()=>{$('#open').classList.add('show');hap(10)},2600)}}
if(n<0){$('#intro').classList.add('rec');setTimeout(()=>{$('#intro').style.display='none';$('#read').style.display='flex';mk()},1000)}else{old.className='layer go';mk()}});
$('#open').onclick=()=>{hap(20);$('#win').classList.add('on');setTimeout(()=>w2[0].focus(),300)};
$('#close').onclick=()=>$('#win').classList.remove('on');
$('#go').onclick=()=>{hap(25);if(URLX){const w=window.open(URLX,'_blank','noopener');if(!w)location.href=URLX}};
const au=$('#au'),mu=$('#mu');let on=false,muted=false;au.volume=0;
function fade(){let v=au.volume;const t=setInterval(()=>{v=Math.min(v+.01,.2);au.volume=v;if(v>=.2)clearInterval(t)},120)}
function play(){au.muted=false;au.play().then(()=>{on=true;mu.textContent='♪';fade()}).catch(()=>{au.muted=true;au.play().catch(()=>{})})}
play();
['pointerdown','touchstart','keydown','click','scroll'].forEach(ev=>addEventListener(ev,e=>{if(on||muted||(e.target.closest&&e.target.closest('#mu')))return;play()},{passive:true}));
mu.onclick=()=>{hap(10);if(on){au.pause();on=false;muted=true;mu.textContent='✕'}else{muted=false;play()}};
const SC=[['#040a24','#0c1a4a','#6a2a55','#2fe3c4','#8a5cff','255,255,255'],['#1a0633','#4a1250','#b5472a','#ff8a3c','#ff4fa0','255,230,190'],['#031a2b','#07404f','#1f6f7a','#3ee0ff','#5c8aff','220,245,255'],['#14082e','#2d1260','#7b3a9e','#c06bff','#ffb3e6','255,220,245'],['#0a1f1c','#0f4a45','#2c7a62','#7dffc2','#ffe08a','230,255,235'],['#2a0a10','#6a1426','#d4802a','#ffcc5c','#ff7a3c','255,225,150']];
function scene(i){const c=SC[i],b=document.body.style;['--a','--b','--c','--g1','--g2'].forEach((k,x)=>b.setProperty(k,c[x]));tint=c[5];const w=$('#world');w.classList.remove('sw0','sw1');void w.offsetWidth;w.classList.add('sw'+(i%2));setTimeout(()=>burst(innerWidth*(.25+Math.random()*.5),innerHeight*.3),800)}
for(let i=0;i<7;i++){const l=document.createElement('div');l.className='lan';const s=16+Math.random()*14;l.style.cssText=`left:${Math.random()*92}vw;width:${s}px;height:${s*1.3}px;--dx:${(Math.random()-.5)*18}vw;animation-duration:${22+Math.random()*18}s;animation-delay:-${Math.random()*30}s`;$('#world').appendChild(l)}
const cv=$('#fx'),cx=cv.getContext('2d');let W,Hh,S=[],T=[],F=[],tint='255,255,255';document.querySelectorAll('.hills,.hd').forEach(e=>$('#world').appendChild(e));
function rs(){W=innerWidth;Hh=innerHeight;cv.width=W*devicePixelRatio;cv.height=Hh*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}rs();addEventListener('resize',rs);
for(let i=0;i<90;i++)S.push({x:Math.random()*W,y:Math.random()*Hh,r:Math.random()*2.5+.7,v:Math.random()*.7+.3,s:Math.random()*6});
for(let i=0;i<70;i++)T.push({x:Math.random()*W,y:Math.random()*Hh*.7,r:Math.random()*1.2+.3,a:Math.random()*6});
function burst(x,y){const h=30+Math.random()*30;for(let i=0;i<46;i++){const a=i/46*6.283,s=2+Math.random()*2.5;F.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,h,life:1})}}
(function loop(){cx.clearRect(0,0,W,Hh);
T.forEach(t=>{t.a+=.03;cx.fillStyle=`rgba(255,244,214,${.25+.6*Math.abs(Math.sin(t.a))})`;cx.beginPath();cx.arc(t.x,t.y,t.r,0,6.283);cx.fill()});
cx.fillStyle=`rgba(${tint},.85)`;S.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.s+=.015)*.5;if(p.y>Hh+4){p.y=-4;p.x=Math.random()*W}cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()});
F=F.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.985;p.life-=.014;cx.fillStyle=`hsla(${p.h},100%,70%,${Math.max(p.life,0)})`;cx.beginPath();cx.arc(p.x,p.y,2,0,6.283);cx.fill();return p.life>0});
requestAnimationFrame(loop)})();
</script></body></html>
