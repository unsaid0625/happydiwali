(function(){

    document.body.dataset.v=h;
    names.forEach(function(n){document.getElementById(n).classList.toggle('on',n===h)});
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',show);show();

  var c=document.getElementById('stars'),x=c.getContext('2d'),stars=[],W=0,H=0,raf=0;
  var calm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){
    var d=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    var n=Math.round(Math.min(150,W*H/9000));
    stars=[];
    for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.25,p:Math.random()*6.28,s:Math.random()*.012+.004,v:Math.random()*.06+.01});
    draw(0);
  }
  function draw(t){
    x.clearRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      var a=.35+.55*(.5+.5*Math.sin(s.p+t*s.s));
      if(!calm){s.y-=s.v*.15;if(s.y<-2)s.y=H+2}
      x.globalAlpha=a;x.fillStyle=i%9===0?'#e8c27a':'#eef1fb';
      x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();
    }
    x.globalAlpha=1;
  }
  function loop(t){draw(t);raf=requestAnimationFrame(loop)}
  size();
  window.addEventListener('resize',size);
  if(!calm){
    raf=requestAnimationFrame(loop);
    document.addEventListener('visibilitychange',function(){
      if(document.hidden)cancelAnimationFrame(raf);else raf=requestAnimationFrame(loop);
    });
  }
})();

  ans={};step=0;window.__svReady=true;
  if(location.hash==="#survey")window.dispatchEvent(new Event("hashchange"));else location.hash="#survey";
  rSurvey();
  await new Promise(r=>setTimeout(r,120));
  intro.classList.remove("on");
  setTimeout(()=>{vid.pause();document.body.style.overflow="";busy=false;window.bgIntro(false);},950);
}
function rSurvey(){
  const C=$("sv");window.scrollTo(0,0);
  const back=()=>{if(step>0){step--;rSurvey();}else location.hash="#home";};
  if(step<3){
    const t=TXT[step];
    C.replaceChildren(...(step===0?[h("div",{class:"svhead"},h("h1",{},"A Question of Feelings"),h("p",{class:"tag"},"Understanding Perspectives Through Honest Opinions."),h("p",{class:"desc"},"“Sometimes, a simple question can make us think differently about human feelings and perspectives.”"))]:[]),h("h2",{},t.h),...t.p.map(x=>h("p",{},x)),
      h("div",{class:"row"},h("button",{class:"btn ghost",onclick:back},step?"Back":"Cancel"),h("button",{class:"btn",onclick:()=>{step++;rSurvey();}},"Continue")));
    return;
  }
  const i=step-3,q=QS[i],last=i===QS.length-1,body=[];
  if(q.o){
    q.o.forEach(o=>body.push(h("label",{class:"opt"},h("input",{type:"radio",name:"q",value:o,...(ans[q.k]===o?{checked:""}:{}),onchange:()=>{ans[q.k]=o;}}),h("span",{},o))));
    if(q.other)body.push(h("input",{type:"text",maxlength:200,placeholder:"If you chose Other, tell us here (optional)",value:ans[q.k+"o"]||"",oninput:e=>{const v=e.target.value.trim();v?ans[q.k+"o"]=v:delete ans[q.k+"o"];}}));
  }else{
    const ta=h("textarea",{maxlength:1000,placeholder:"Write your thoughts here (optional)",oninput:e=>{const v=e.target.value.trim();v?ans[q.k]=v:delete ans[q.k];}});
    ta.value=ans[q.k]||"";body.push(ta);
  }
  const go=e=>{if(last)submit(e.currentTarget);else{step++;rSurvey();}};
  C.replaceChildren(
    h("p",{class:"hint"},"Question "+(i+1)+" of "+QS.length),h("progress",{max:QS.length,value:i+1}),
    h("h2",{style:"font-size:26px;margin-top:14px"},q.q),...body,
    h("div",{class:"row"},
      h("button",{class:"btn ghost",onclick:back},"Back"),
      h("button",{class:"btn ghost",onclick:e=>{delete ans[q.k];delete ans[q.k+"o"];go(e);}},"Skip"),
      h("button",{class:"btn",onclick:go},last?"Submit":"Next")));
}
async function submit(btn){
  btn.disabled=true;
  const d={};
  for(const q of QS){if(ans[q.k])d[q.k]=ans[q.k];if(ans[q.k+"o"])d[q.k+"o"]=ans[q.k+"o"];}
  try{
    const b=writeBatch(db);
    b.set(doc(collection(db,"surveys")),{...d,createdAt:serverTimestamp()});
    await b.commit();
    $("sv").replaceChildren(h("h2",{},"Thank you"),h("p",{},"Your answers have been submitted. We truly appreciate your time."),
      h("button",{class:"btn",onclick:()=>{location.hash="#home";}},"Back to Home"));
  }catch(e){btn.disabled=false;alert(errText(e));}
}

/* ---------- messages (no account; this browser keeps a private chat key) ---------- */
function newKey(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,"0")).join("");}
try{chatId=localStorage.getItem("qof_chat");}catch(e){}
function watch(){
  unM();unC();cm=[];cc=null;
  if(!chatId)return;
  const r=doc(db,"chats",chatId);
  unM=onSnapshot(query(collection(r,"messages"),orderBy("createdAt")),s=>{cm=s.docs.map(d=>d.data());rMsg();},()=>{});
  unC=onSnapshot(r,s=>{
    cc=s.exists()?s.data():null;
    if(cc&&cc.unreadUser&&location.hash==="#msg")updateDoc(r,{unreadUser:false}).catch(()=>{});
    rMsg();
  },()=>{});
}
function rMsg(){
  if(!$("m-th")){
    const ta=h("textarea",{id:"m-in",rows:1,maxlength:1000,placeholder:"Type your message…"});
    const send=h("button",{class:"sendbtn",id:"m-send",type:"button","aria-label":"Send message",onclick:sendMsg});send.innerHTML=SEND;
    ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=Math.min(140,ta.scrollHeight)+"px";});
    ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(pointer:coarse)").matches){e.preventDefault();send.click();}});
    $("m-card").replaceChildren(
      h("div",{class:"chathead"},h("h2",{},"Message the Admin"),h("p",{class:"sub"},"No name or account needed. Replies appear here, so please use the same browser to see them later.")),
      h("div",{id:"m-th",class:"chatlog"}),
      h("p",{class:"hint"},"Replying to the personal note? Begin your message with #responce25."),
      h("div",{class:"composer"},ta,send));
  }
  const th=$("m-th"),near=th.scrollHeight-th.scrollTop-th.clientHeight<90;
  th.replaceChildren(...(cm.length?cm.map(m=>h("div",{class:"mb "+(m.from==="admin"?"them":"me")},h("div",{class:"mt"},m.text),h("small",{},(m.from==="admin"?"Admin · ":"")+(fmt(m.createdAt)||"Sending…")))):[h("p",{class:"empty"},"No messages yet.")]));
  if(near)th.scrollTop=th.scrollHeight;
  const ta=$("m-in");
  if(pre&&!ta.value){ta.value=pre;pre="";ta.dispatchEvent(new Event("input"));setTimeout(()=>ta.focus(),400);}
}
async function sendMsg(e){
  const ta=$("m-in"),text=ta.value.trim();if(!text)return;
  const btn=e.currentTarget;btn.disabled=true;
  const b=writeBatch(db);let id=chatId,fresh=false;
  if(!id){id=newKey();fresh=true;}
  const r=doc(db,"chats",id);
  if(fresh)b.set(r,{title:text.slice(0,60),status:"open",createdAt:serverTimestamp(),lastMessageAt:serverTimestamp(),unreadAdmin:true,unreadUser:false});
  else b.update(r,{status:"open",lastMessageAt:serverTimestamp(),unreadAdmin:true});
  b.set(doc(collection(r,"messages")),{from:"user",text,createdAt:serverTimestamp()});
  try{
    await b.commit();ta.value="";ta.style.height="auto";
    if(fresh){chatId=id;try{localStorage.setItem("qof_chat",id);}catch(x){}watch();}
  }catch(x){
    if(!fresh&&x&&x.code==="not-found"){
      // saved chat no longer exists: forget it and start a new one
      try{localStorage.removeItem("qof_chat");}catch(y){}
      unM();unC();chatId=null;cm=[];cc=null;
      btn.disabled=false;
      return sendMsg({currentTarget:btn});
    }
    alert(errText(x));
  }
  btn.disabled=false;
}

$("go-survey").onclick=startSurvey;
$("go-msg").onclick=()=>{location.hash="#msg";};
window.addEventListener("hashchange",()=>{
  if(location.hash==="#msg"){rMsg();if(cc&&cc.unreadUser)updateDoc(doc(db,"chats",chatId),{unreadUser:false}).catch(()=>{});}
  if(location.hash==="#admin")adminView();
});
rMsg();watch();

/* ---------- reveal, haptics, note, unsaid ---------- */
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
const tick=()=>{if(calm)return;try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}};
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add("in");if(e.target.dataset.hap)tick();io.unobserve(e.target);}
}),{threshold:.3,rootMargin:"0px 0px -6% 0px"});
const watchRv=el=>calm?el.classList.add("in"):io.observe(el);
document.querySelectorAll(".rv").forEach(watchRv);
document.addEventListener("click",e=>{if(e.target.closest(".btn,.tab"))tick();});

const NOTE=[["lead", "I don’t know how you felt after reading my messages. Maybe you felt confused or even a little scared, wondering who suddenly appeared in your life and why. I understand that, and I’m genuinely sorry if my messages have disturbed your peace in any way."], ["p", "Please don’t take any stress about this. Just take it easy. Honestly, I feel nervous talking to you, even online. You seem like a serious person (I’m not judging you; that’s just the impression I get), and sometimes I genuinely don’t know how you’ll react to what I say."], ["p", "About my identity, I don’t have any problem sharing it with you. In fact, by now, I think I’ve given you enough hints to have some idea about who I might be. Maybe you’ve already figured it out. The only reason I haven’t directly told you is that I’m genuinely scared of your reaction once I reveal it."], ["p", "It’s not that I don’t trust you or think you’ll share it with someone else. That’s not the concern at all. It’s simply the thought of how you’ll react after knowing who I am that makes me nervous. I honestly don’t know how to explain this feeling properly. Somehow, saying it directly feels much harder than giving you hints."], ["p", "To be honest, I don’t even know whether the way I’m approaching you is right or wrong. Maybe I’m making a mistake, and I genuinely don’t know. But one thing I can say is that I’ve never felt this way about anyone before. Calling it simply liking someone would be an understatement. I think you understand what I’m trying to express."], ["p", "All I’m asking for is one chance to have a simple, friendly conversation with you. Nothing more than that. I’d really appreciate it if we could start with a normal conversation rather than questions like, “I don’t know who you are” or “Who are you?” Honestly, those words make me nervous now. 🥲"], ["p", "There are so many things I’ve wanted to tell you for a very long time. I want to be completely honest about everything, but somehow, I keep getting nervous. I don’t even understand why I feel this way when talking to you."], ["p", "I also tried quite a few things back in those days to get your attention, but I don’t think any of them really worked. Maybe they went unnoticed, or maybe I simply never made my intentions clear enough. A lot of it was because I never had the courage to express myself properly. There are things from those days that I’d still like to tell you about, if you’d ever be interested in hearing them."], ["p", "I won’t pretend that I have no expectations. Honestly, I do have hopes about how this conversation might turn out. I’d be lying if I said otherwise. But having expectations doesn’t mean I expect you to feel the same way or make a decision in my favour. I’d genuinely be happy if we could have a conversation, but I’ll respect your decision even if things don’t turn out the way I’m hoping."], ["p", "Once again, please don’t take any stress because of this. If you genuinely don’t wish to continue this conversation, you can simply tell me. I’ll understand, step back, and won’t contact you again. I genuinely mean that."], ["h", "A little about this website"], ["p", "You can write whatever you genuinely want to say in the message section. And please don’t worry about providing personal details. The website doesn’t ask for your name, email address, or other personal information, and it doesn’t use cookies. Just add #responce25 before your message so I’ll know it’s actually you."], ["p", "By the way, I made this website myself. At least you can appreciate this little effort! 🙂"], ["p", "I took help from AI tools like Claude and ChatGPT, but building it wasn’t easy. There are quite a few things running in the backend to make everything work properly. Setting up the backend, connecting different services, and making sure everything functions as expected took quite a bit of effort."], ["p", "I wanted to create a simple space where we could communicate, if you ever wanted to. That’s the whole idea behind it."], ["p", "And once again, please don’t take any stress. Take your time, and whatever you decide, I’ll respect it. I’d just appreciate it if you could let me know your answer whenever you’re ready."], ["h", "One last thing I want to say"], ["p", "Honestly, I don’t even know what I’m doing. I sometimes wonder who approaches someone this way, without knowing how the other person might feel about it. I don’t know whether you’ll appreciate this effort or whether you’ll find it unexpected. If you don’t like the way I’ve approached you, I’m genuinely sorry."], ["p", "You know, sometimes I do things and only think about them afterwards. Then I wonder whether I’ve made the right decision or whether I’ll regret it someday. I don’t know if this will be one of those moments. Maybe I will regret it in the future, or maybe I won’t. But at this point, I felt that expressing myself was better than keeping everything to myself once again. That’s why I finally decided to do it."], ["lead", "Whatever happens after this, at least I’ll know that I tried to express what I’ve been holding inside for so long."]];

/* ---------- admin gate ---------- */
const say=(f,t)=>{const n=f.querySelector(".notice");n.textContent=t;n.hidden=!t;};
function adminView(){
  const ok=!!auth.currentUser&&auth.currentUser.email===ADMIN_EMAIL;
  $("ad-gate").hidden=ok;$("ad-panel").hidden=!ok;
  if(ok)Admin.enter();
}
$("ad-gate").addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,b=f.querySelector("button");
  b.disabled=true;say(f,"");
  try{
    const p=$("ap").value;if(!p)throw {code:"auth/invalid-credential"};
    await signInWithEmailAndPassword(auth,ADMIN_EMAIL,p);$("ap").value="";
  }catch(x){say(f,errText(x));}
  b.disabled=false;
});
onAuthStateChanged(auth,user=>{
  // Drop any leftover session from the old guest-account version of the site.
  if(user&&user.email!==ADMIN_EMAIL){signOut(auth);return;}
  if(!user)Admin.leave();
  adminView();
});
})();
